name: Build macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release metadata
        id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="${TAG_INPUT:-$GITHUB_REF_NAME}"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Release tag must match the application version v$VERSION" >&2
            exit 1
          fi
          test -f "docs/releases/$TAG.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Inspect toolchain
        run: swift --version

      - name: Run tests
        run: swift test -c release --scratch-path "$GITHUB_WORKSPACE/.build" --disable-sandbox

      - name: Build and verify universal packages
        run: bash scripts/package-release.sh

      - name: Upload verified packages to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          PACKAGES="$GITHUB_WORKSPACE/build/releases/$RELEASE_TAG"
          NOTES="$GITHUB_WORKSPACE/docs/releases/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release already published; create a new version tag instead of replacing public assets." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "$PACKAGES"/*.dmg "$PACKAGES"/*.zip "$PACKAGES/SHA256SUMS"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES" --prerelease
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
              --title "$RELEASE_TAG · Developer Preview / 开发预览" --notes-file "$NOTES" \
              "$PACKAGES"/*.dmg "$PACKAGES"/*.zip "$PACKAGES/SHA256SUMS"
          fi
          # Inspect the downloadable assets before publishing the first draft.
