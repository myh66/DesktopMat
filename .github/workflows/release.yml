name: Build macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "Release tag is required" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_name=DesktopMat-${TAG}-macOS.zip" >> "$GITHUB_OUTPUT"

      - name: Inspect toolchain
        run: swift --version

      - name: Run tests
        run: swift test -c release --scratch-path "$GITHUB_WORKSPACE/.build" --disable-sandbox

      - name: Build native app bundle
        run: bash scripts/build-app.sh release

      - name: Package release artifact
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/一席 · Desktop Mat.app"
          ZIP_PATH="$GITHUB_WORKSPACE/build/${{ steps.meta.outputs.zip_name }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: build/${{ steps.meta.outputs.zip_name }}
          if-no-files-found: error

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            build/${{ steps.meta.outputs.zip_name }}
